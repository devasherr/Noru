services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel_ems_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotel_admin
      POSTGRES_PASSWORD: hotel_123
      POSTGRES_DB: hotel_ems
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_admin -d hotel_ems"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
